name: "Auto Build sing-box"

env:
  DOCKER_REPO: "sing-box"
  GITHUB_REPO: "SagerNet/sing-box"
  DOCKER_FILE: "Dockerfile-sing-box"
  APP_NAME: "sing-box"

on:
  repository_dispatch:
    types: [Auto Build sing-box]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  process-dispatch:
    runs-on: ubuntu-latest
    name: "process-dispatch"
    outputs:
      status: ${{ steps.check-repo-dispatch.outputs.status }}
    steps:
      - id: check-repo-dispatch
        run: |
          EXPECTED_REPO="${{ env.GITHUB_REPO }}"
          ACTUAL_REPO="${{ github.event.client_payload.owner }}/${{ github.event.client_payload.repo }}"

          echo "[INFO] 期望的仓库名称: $EXPECTED_REPO"
          echo "[INFO] 实际的仓库名称: $ACTUAL_REPO"
          echo "[INFO] 事件载荷的属主: ${{ github.event.client_payload.owner }}"
          echo "[INFO] 事件载荷的仓库: ${{ github.event.client_payload.repo }}"
          echo "[INFO] 接受的完整载荷: ${{ toJSON(github.event.client_payload) }}"

          if [ "$EXPECTED_REPO" = "$ACTUAL_REPO" ]; then
            echo "[INFO] 仓库名称确认成功"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "[ERROR] 仓库名称确认失败"
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

  check-version:
    needs: process-dispatch
    if: ${{ needs.process-dispatch.outputs.status == 'success' }}
    runs-on: ubuntu-latest
    name: "Check version"
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      commit: ${{ steps.get-version.outputs.commit }}
      go_version: ${{ steps.get-version.outputs.go_version }}
    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: check version
        id: get-version
        run: |
          LATEST_VERSION="${{ github.event.client_payload.version }}"
          GO_VERSION=$(curl -s https://go.dev/VERSION?m=text | awk 'NR==1' | sed 's/^go//')
          DATE=$(date "+%Y/%m/%d")
          COMMIT="Build ${{ env.APP_NAME}} $LATEST_VERSION by Github Actions, $DATE"

          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "go_version=$GO_VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

  create-release:
    needs: check-version
    runs-on: ubuntu-latest
    name: "create release"
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      MSG: ${{ needs.check-version.outputs.commit }}
    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: create release
        uses: shogo82148/actions-create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          release_name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          body: ${{ env.MSG }}
          draft: false
          prerelease: false
          overwrite: true

  build-docker-image:
    needs: check-version
    runs-on: ubuntu-latest
    name: "build docker image"
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push Default (v3) image
        uses: docker/build-push-action@v7
        env:
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_REPO }}
        with:
          push: true
          file: docker/${{ env.DOCKER_FILE }}
          platforms: linux/amd64, linux/arm64
          build-args: |
            BRANCH=${{ env.VERSION }}
            GOAMD64_VERSION=v3
          tags: |
            ${{ env.DOCKERHUB_REPOSITORY }}:latest
            ${{ env.DOCKERHUB_REPOSITORY }}:${{ env.VERSION }}

      - name: Build and push Compat (v1) image
        uses: docker/build-push-action@v7
        env:
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_REPO }}
        with:
          push: true
          file: docker/${{ env.DOCKER_FILE }}
          platforms: linux/amd64, linux/arm64
          build-args: |
            BRANCH=${{ env.VERSION }}
            GOAMD64_VERSION=v1
          tags: |
            ${{ env.DOCKERHUB_REPOSITORY }}:latest-compat
            ${{ env.DOCKERHUB_REPOSITORY }}:${{ env.VERSION }}-compat

  build-releases:
    needs: check-version
    name: build releases
    env:
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
      GOAMD64: v3
      BINARY: sing-box
      VERSION: ${{ needs.check-version.outputs.version }}
      GO_VERSION: ${{ needs.check-version.outputs.go_version }}

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc

          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: clone repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITHUB_REPO }}
          ref: "${{ env.VERSION }}"
          fetch-depth: 1
          submodules: recursive
          
      - name: Install build tools
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc upx \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross
            
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Verify ARM64 compiler
        if: matrix.goarch == 'arm64'
        run: |
          command -v aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version
    
      - name: Configure build environment
        run: |
          echo "GOOS=${{ matrix.goos }}" >> "$GITHUB_ENV"
          echo "GOARCH=${{ matrix.goarch }}" >> "$GITHUB_ENV"
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          
      - name: Build
        id: build
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -tags "with_tailscale,with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_v2ray_api,with_grpc" \
            -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=${VERSION}" \
            -o "dist/sing-box-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/sing-box
          upx --best --lzma dist/sing-box-${{ matrix.goos }}-${{ matrix.goarch }}

          echo "status=success" >> $GITHUB_OUTPUT

      - name: upload binaries to artifact
        if: steps.build.outputs.status == 'success' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}-${{ env.VERSION }}
          path: dist/

      - name: prepare release
        if: steps.build.outputs.status == 'success' && !cancelled()
        run: |
          cd dist
          tar czf sing-box-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz sing-box
          rm sing-box

      - name: upload binaries to release
        id: release
        if: steps.build.outputs.status == 'success' && !cancelled()
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/*
          file_glob: true
          tag: ${{ env.APP_NAME }}-${{ env.VERSION }}
          overwrite: true
          body: ${{ needs.check-version.outputs.commit }}

  update-repo:
    needs:
      - check-version
      - create-release
      - build-docker-image
      - build-releases
    runs-on: ubuntu-latest
    name: "update repo"
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      COMMIT: ${{ needs.check-version.outputs.commit }}

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: mark
        run: |
          git checkout --orphan tmp_work
          git branch -d main

          sed -i -E 's/(\|\s*${{ env.APP_NAME }}\s*\|)\s*\S+\s*\|/\1 ${{ env.VERSION }} \|/' README.md

          # Update repos.json
          IFS='/' read -r owner repo <<< "${{ env.GITHUB_REPO }}"
          jq --arg owner "$owner" --arg repo "$repo" --arg new_version "${{ env.VERSION }}" \
              'map(if .owner == $owner and .repo == $repo then .version = $new_version else . end)' \
              .github/workflows/repos.json > update_repos.json
          mv update_repos.json .github/workflows/repos.json
          cat .github/workflows/repos.json

      - name: upload to repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ env.COMMIT }}
          create_branch: true
          branch: main
          push_options: --force

      - name: delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: "${{ env.APP_NAME }}"
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: "cancelled, skipped, success"
